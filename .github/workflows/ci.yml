name: Native installer
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      real:
        description: Run the full fixed-baseline published Computer matrix
        type: boolean
        default: false
      candidate:
        description: Exact published Computer candidate version (optional, including prerelease)
        type: string
        default: ''
  workflow_call:
    inputs:
      real:
        type: boolean
        default: false
      candidate:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: select
        name: Select coverage from event and changed files
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.real }}
          CANDIDATE: ${{ inputs.candidate }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: python
        run: |
          import os, subprocess
          event, candidate = os.environ['EVENT'], os.environ['CANDIDATE']
          mode = 'full' if os.environ['FULL'] == 'true' else 'candidate' if candidate else 'latest' if event == 'schedule' else 'control'
          if event in ('push', 'pull_request') and mode == 'control':
              base = os.environ.get('BASE', '')
              if base and set(base) != {'0'}:
                  paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
                  if paths and all(p.endswith('.md') for p in paths):
                      mode = 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + mode + '\n')
      - name: Freeze one plan for all platforms
        if: steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
          CANDIDATE: ${{ inputs.candidate }}
        shell: python
        run: |
          import os, subprocess, sys
          args = [sys.executable, 'verification/matrix.py', 'plan', '--mode', os.environ['MODE'], '--output', 'matrix-plan.json']
          if os.environ['CANDIDATE']:
              args += ['--candidate', os.environ['CANDIDATE']]
          subprocess.run(args, check=True)
      # Every platform job downloads this plan: blocking, but one transient
      # artifact-service failure (e.g. CreateArtifact timeout) gets a retry.
      - id: upload_plan
        uses: actions/upload-artifact@v4
        if: steps.select.outputs.mode != 'none'
        continue-on-error: true
        with:
          name: published-matrix-plan
          path: matrix-plan.json
          if-no-files-found: error
      - name: Wait before retrying the plan upload
        if: steps.upload_plan.outcome == 'failure'
        run: sleep 30
      - uses: actions/upload-artifact@v4
        if: steps.upload_plan.outcome == 'failure'
        with:
          name: published-matrix-plan
          path: matrix-plan.json
          if-no-files-found: error
          overwrite: true
  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64, rust_target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: linux-arm64, rust_target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
          # Linux installers are static musl binaries (scripts/build.py) so one
          # artifact loads on any distribution's glibc; the host-gnu build made
          # on this runner demanded GLIBC_2.39 and refused to start on RHEL 9.
          targets: ${{ matrix.rust_target || '' }}
      - name: Install the musl linker
        if: ${{ matrix.rust_target }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/verify.py
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && needs.plan.outputs.mode != 'none' }}
        with:
          name: published-matrix-plan
      - name: Published Computer independent cold scenarios
        if: ${{ !cancelled() && needs.plan.outputs.mode != 'none' }}
        run: python verification/matrix.py run --plan matrix-plan.json --output matrix-results/${{ matrix.target }}.json
      # Diagnostic only: the matrix verdict is the step above. A failed upload
      # must not block a release (v0.3.12 shipped nothing over one
      # CreateArtifact timeout); it is surfaced as a warning instead.
      - id: upload_results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.plan.outputs.mode != 'none' }}
        continue-on-error: true
        with:
          name: matrix-results-${{ matrix.target }}
          path: matrix-results/*.json
          if-no-files-found: error
      - name: Report a missing diagnostic upload
        if: ${{ !cancelled() && steps.upload_results.outcome == 'failure' }}
        shell: bash
        run: echo "::warning title=matrix results not uploaded::matrix-results-${{ matrix.target }} upload failed; the matrix verdict above is unaffected"
      # The release job assembles from this artifact: it stays blocking, with
      # one retry so a transient artifact-service failure does not kill it.
      - id: upload_native
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/
          if-no-files-found: error
      - name: Wait before retrying the native artifact upload
        if: steps.upload_native.outcome == 'failure'
        shell: bash
        run: echo "::warning title=native artifact upload retried::first upload of native-${{ matrix.target }} failed" && sleep 30
      - uses: actions/upload-artifact@v4
        if: steps.upload_native.outcome == 'failure'
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/
          if-no-files-found: error
          overwrite: true
