name: Installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  native:
    uses: ./.github/workflows/ci.yml
    with:
      real: true
  release:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/downloaded
      - name: Arrange platform artifacts
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('dist')
          for source in (root / 'downloaded').glob('native-*'):
              destination = root / 'native' / source.name.removeprefix('native-')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(source), destination)
              for binary in destination.glob('raft-computer-installer*'):
                  binary.chmod(0o755)
          shutil.rmtree(root / 'downloaded')
      - run: python scripts/build.py --assemble --require-all
      - name: Inspect local release inventory
        run: python scripts/publish.py --version-code "$GITHUB_RUN_ID"
      - name: Publish one complete Hands release and read it back
        env:
          HANDS_AUTH_TOKEN: ${{ secrets.HANDS_INSTALLER_DEPLOY_TOKEN }}
        run: >-
          python scripts/publish.py --publish --version-code "$GITHUB_RUN_ID"
          --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Archive the immutable release
        shell: python
        run: |
          import os
          import tarfile
          with tarfile.open('raft-computer-installer-' + os.environ['GITHUB_REF_NAME'] + '.tar.gz', 'w:gz') as archive:
              archive.add('dist', arcname='.')
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/install.ps1 dist/installer-manifest.json dist/SHA256SUMS \
            "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "Installer $GITHUB_REF_NAME" \
            --generate-notes "${args[@]}"
