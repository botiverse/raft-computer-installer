name: Installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  native:
    strategy:
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          - { os: macos-13, platform: darwin-x64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: windows-latest, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        # test:real installs real Computer releases (~160 MB each, K keeps the
        # previous slot and a quarantined copy); every v0.2.0 release run died
        # of ENOSPC on linux-x64. Drop the preinstalled toolchains we never use.
        if: runner.os == 'Linux'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native
      - run: npm test
        env:
          RCI_NATIVE: "1"
      - run: npm run test:native
      - name: Disk before test:real
        if: runner.os != 'Windows'
        run: df -h / | tail -1; du -sh "${TMPDIR:-/tmp}" 2>/dev/null || true
      - run: npm run test:real
        if: runner.os != 'Windows'
        env:
          RCI_NATIVE: "1"
      - name: Disk after test:real
        if: always() && runner.os != 'Windows'
        run: df -h / | tail -1; du -sh "${TMPDIR:-/tmp}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/${{ matrix.platform }}/
          if-no-files-found: error
  release:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -f dist/cli.cjs dist/runner.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native/
      - name: Assemble one manifest over native files
        env:
          K_COMMIT: c51651931712ee72189d612704dc37cbf7e0a949
        run: |
          for d in dist/native/native-*; do mv "$d" "dist/native/${d##*/native-}"; done
          chmod 0755 dist/native/*/raft-computer-installer* || true
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("dist/installer-manifest.json"));
            for (const platform of fs.readdirSync("dist/native")) for (const name of fs.readdirSync(path.join("dist/native", platform))) {
              const f = `native/${platform}/${name}`; const b = fs.readFileSync(path.join("dist", f));
              m.files[f] = { sha256: crypto.createHash("sha256").update(b).digest("hex"), size: b.length };
            }
            m.gitCommit = process.env.GITHUB_SHA; m.kCommit = process.env.K_COMMIT;
            fs.writeFileSync("dist/installer-manifest.json", JSON.stringify(m, null, 2) + "\n");
            fs.writeFileSync("dist/SHA256SUMS", Object.entries(m.files).map(([f, x]) => `${x.sha256}  ${f}\n`).join(""));
          '
          npm run verify:release
          (cd dist && sha256sum installer-manifest.json >> SHA256SUMS)
      - name: Mirror the release to the CDN
        # cdn.raft.build/installer/<version>/ is where the bootstrap fetches
        # from. Needs the production R2 credentials as repository secrets;
        # without them the release is only on GitHub and this step says so.
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_PROD_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PROD_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://a699265b21e68a0071d322cc5051cc4f.r2.cloudflarestorage.com
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then echo "::warning::R2_PROD_* secrets are not set; not mirrored to the CDN"; exit 0; fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          version="${GITHUB_REF_NAME#v}"
          dest="s3://slock-cdn/installer/$version"
          if aws --endpoint-url "$R2_ENDPOINT" s3 ls "$dest/SHA256SUMS" >/dev/null 2>&1; then echo "::error::$dest already exists; releases are immutable"; exit 1; fi
          aws --endpoint-url "$R2_ENDPOINT" s3 cp dist/ "$dest/" --recursive --no-progress
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('dist/installer-manifest.json'));
          for (const f of Object.keys(m.files)) {
            if (f === 'cli.cjs' || f === 'runner.mjs') throw new Error(`portable release asset: ${f}`);
          }
          NODE
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            out="$(mktemp)"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$dest/$f" "$out" --no-progress
            cmp "dist/$f" "$out"
            rm -f "$out"
          done < <(jq -r '.files | keys[]' dist/installer-manifest.json)
          out="$(mktemp)"
          aws --endpoint-url "$R2_ENDPOINT" s3 cp "$dest/installer-manifest.json" "$out" --no-progress
          cmp dist/installer-manifest.json "$out"
          rm -f "$out"
          aws --endpoint-url "$R2_ENDPOINT" s3 cp "$dest/SHA256SUMS" "$out" --no-progress
          cmp dist/SHA256SUMS "$out"
          rm -f "$out"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && tar -czf "../raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" .)
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/install.ps1 dist/installer-manifest.json dist/SHA256SUMS \
            "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "Installer $GITHUB_REF_NAME" --generate-notes --prerelease
          for f in dist/native/*/raft-computer-installer*; do
            p="${f#dist/native/}"; gh release upload "$GITHUB_REF_NAME" "$f#native-${p%%/*}-${p##*/}" --repo "$GITHUB_REPOSITORY"
          done
