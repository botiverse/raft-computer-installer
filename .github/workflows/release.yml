name: Installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:release
      - run: npm test
      - name: Add provenance and checksums
        env:
          K_COMMIT: b14fa62e06937bb8a4639410bf6ccaaaf0d460a8
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("dist/installer-manifest.json")); m.gitCommit=process.env.GITHUB_SHA; m.kCommit=process.env.K_COMMIT; fs.writeFileSync("dist/release-provenance.json", JSON.stringify(m,null,2)+"\n")'
          (cd dist && sha256sum cli.cjs runner.mjs install.sh installer-manifest.json release-provenance.json > SHA256SUMS)
          tar -czf "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" -C dist .
          sha256sum "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" > "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Installer $GITHUB_REF_NAME" --generate-notes --prerelease
