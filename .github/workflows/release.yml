name: Installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  native:
    uses: ./.github/workflows/ci.yml
    with:
      real: true
  release:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/downloaded
      - name: Arrange platform artifacts
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('dist')
          for source in (root / 'downloaded').glob('native-*'):
              destination = root / 'native' / source.name.removeprefix('native-')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(source), destination)
              for binary in destination.glob('raft-computer-installer*'):
                  binary.chmod(0o755)
          shutil.rmtree(root / 'downloaded')
      - run: python scripts/build.py --assemble --require-all
      - name: Inspect local release inventory
        run: python scripts/publish.py --version-code "$GITHUB_RUN_ID"
      - name: Publish one complete Hands release and read it back
        env:
          HANDS_AUTH_TOKEN: ${{ secrets.HANDS_INSTALLER_DEPLOY_TOKEN }}
        run: >-
          python scripts/publish.py --publish --version-code "$GITHUB_RUN_ID"
          --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Archive the immutable release
        shell: python
        run: |
          import os
          import tarfile
          with tarfile.open('raft-computer-installer-' + os.environ['GITHUB_REF_NAME'] + '.tar.gz', 'w:gz') as archive:
              archive.add('dist', arcname='.')
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/install.ps1 dist/installer-manifest.json dist/SHA256SUMS \
            "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "Installer $GITHUB_REF_NAME" \
            --generate-notes "${args[@]}"
  # A failed tag release used to be silent (v0.3.12 shipped nothing for two
  # days). Keep one open `release-failure` issue per tag: open or comment on
  # failure, close it once a rerun of that tag publishes.
  report:
    needs: [native, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RESULTS: native=${{ needs.native.result }} release=${{ needs.release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          title="Installer release $TAG failed"
          existing=$(gh issue list --label release-failure --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$FAILED" != true ]; then
            if [ -n "$existing" ] && [ "$RELEASE_RESULT" = success ]; then
              gh issue close "$existing" --comment "Published by $RUN_URL."
            fi
            exit 0
          fi
          failed=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')
          body=$(printf 'Tag `%s` was **not published**.\n\nRun: %s\nResults: %s\n\nFailed jobs:\n%s\n\nRerun failed jobs once the cause is understood; this issue closes when a run of this tag publishes.\n' \
            "$TAG" "$RUN_URL" "$RESULTS" "${failed:-"(none reported; read the run)"}")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create release-failure --color B60205 --description "Tag release workflow failed" --force
            gh issue create --title "$title" --label release-failure --body "$body"
          fi
          echo "::error title=release $TAG not published::$RUN_URL"
