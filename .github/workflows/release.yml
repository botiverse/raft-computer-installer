name: Installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  native:
    strategy:
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          - { os: macos-13, platform: darwin-x64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: windows-latest, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        # test:real installs real Computer releases (~160 MB each, K keeps the
        # previous slot and a quarantined copy); every v0.2.0 release run died
        # of ENOSPC on linux-x64. Drop the preinstalled toolchains we never use.
        if: runner.os == 'Linux'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:native
      - run: npm test
        env:
          RCI_NATIVE: "1"
      - run: npm run test:native
      - name: Disk before test:real
        if: runner.os != 'Windows'
        run: df -h / | tail -1; du -sh "${TMPDIR:-/tmp}" 2>/dev/null || true
      - run: npm run test:real
        if: runner.os != 'Windows'
        env:
          RCI_NATIVE: "1"
      - name: Disk after test:real
        if: always() && runner.os != 'Windows'
        run: df -h / | tail -1; du -sh "${TMPDIR:-/tmp}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/${{ matrix.platform }}/
          if-no-files-found: error
  release:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -f dist/cli.cjs dist/runner.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native/
      - name: Assemble one manifest over native files
        env:
          K_COMMIT: c51651931712ee72189d612704dc37cbf7e0a949
        run: |
          for d in dist/native/native-*; do mv "$d" "dist/native/${d##*/native-}"; done
          chmod 0755 dist/native/*/raft-computer-installer* || true
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("dist/installer-manifest.json"));
            for (const platform of fs.readdirSync("dist/native")) for (const name of fs.readdirSync(path.join("dist/native", platform))) {
              const f = `native/${platform}/${name}`; const b = fs.readFileSync(path.join("dist", f));
              m.files[f] = { sha256: crypto.createHash("sha256").update(b).digest("hex"), size: b.length };
            }
            m.gitCommit = process.env.GITHUB_SHA; m.kCommit = process.env.K_COMMIT;
            fs.writeFileSync("dist/installer-manifest.json", JSON.stringify(m, null, 2) + "\n");
            fs.writeFileSync("dist/SHA256SUMS", Object.entries(m.files).map(([f, x]) => `${x.sha256}  ${f}\n`).join(""));
          '
          npm run verify:release
          (cd dist && sha256sum installer-manifest.json >> SHA256SUMS)
      - name: Per-target checksums
        # Hands serves ?kind=sha256sums per target, so each target gets the
        # two lines of SHA256SUMS that name its installer and runner. The
        # bootstrap verifies exactly those two.
        run: |
          for d in dist/native/*/; do
            t="${d#dist/native/}"; t="${t%/}"
            grep -E "  native/${t}/raft-computer-installer(\.exe)?$|  native/${t}/raft-computer-installer-runner(\.exe)?$" dist/SHA256SUMS > "dist/native/${t}/SHA256SUMS"
            test "$(wc -l < "dist/native/${t}/SHA256SUMS")" -eq 2
          done
      - name: Publish to Hands (hosted cli-binary)
        # hands.build hosts the installer bytes; the bootstrap fetches
        # /dl/raft-computer-installer/<channel>/<target>. One call publishes
        # one build carrying every target's installer, runner and checksums,
        # and one release on the channel. Pre-release tags (-rc.N) go to
        # alpha, plain tags to main. Needs HANDS_INSTALLER_DEPLOY_TOKEN.
        env:
          HANDS_AUTH_TOKEN: ${{ secrets.HANDS_INSTALLER_DEPLOY_TOKEN }}
        run: |
          if [ -z "$HANDS_AUTH_TOKEN" ]; then echo "::error::HANDS_INSTALLER_DEPLOY_TOKEN is not set; the release cannot reach Hands"; exit 1; fi
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) channel=alpha ;; *) channel=main ;; esac
          set -- builds publish-cli-binary raft-computer-installer \
            --version-name "$version" --channel "$channel" \
            --source-commit "$GITHUB_SHA" --ci-provider github --ci-run-id "$GITHUB_RUN_ID" \
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for d in dist/native/*/; do
            t="${d#dist/native/}"; t="${t%/}"
            exe=""; case "$t" in win32-*) exe=".exe" ;; esac
            set -- "$@" --target "$t" \
              --binary "dist/native/${t}/raft-computer-installer${exe}" \
              --runner "dist/native/${t}/raft-computer-installer-runner${exe}" \
              --sha256sums "dist/native/${t}/SHA256SUMS"
          done
          npx -y @botiverse/hands-cli@0.5.23 "$@"
          # Read back through the public surface the bootstrap uses.
          for d in dist/native/*/; do
            t="${d#dist/native/}"; t="${t%/}"
            loc="$(curl -fsS -o /dev/null -w '%{redirect_url}' "https://hands.build/dl/raft-computer-installer/${channel}/${t}")"
            test -n "$loc" || { echo "::error::no release resolves for ${t} on ${channel}"; exit 1; }
            case "$loc" in /*) loc="https://hands.build$loc" ;; esac
            curl -fsSL "$loc?kind=sha256sums" | cmp - "dist/native/${t}/SHA256SUMS"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && tar -czf "../raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" .)
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/install.ps1 dist/installer-manifest.json dist/SHA256SUMS \
            "raft-computer-installer-${GITHUB_REF_NAME}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "Installer $GITHUB_REF_NAME" --generate-notes --prerelease
          for f in dist/native/*/raft-computer-installer*; do
            p="${f#dist/native/}"; gh release upload "$GITHUB_REF_NAME" "$f#native-${p%%/*}-${p##*/}" --repo "$GITHUB_REPOSITORY"
          done
